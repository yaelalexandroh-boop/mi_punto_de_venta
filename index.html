<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE POS | Enterprise Full Suite</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { background: #020617; font-family: 'Inter', sans-serif; color: white; overflow: hidden; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.7); }
        .low-stock { border: 1px solid rgba(239, 68, 68, 0.5) !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; border: 2px solid #6366f1 !important; margin-bottom: 20px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB_y5tjnNrdMli8_5bd1tKZSSoaCwPRgIA",
            databaseURL: "https://mi-punto-de-venta-e1889-default-rtdb.firebaseio.com",
            projectId: "mi-punto-de-venta-e1889",
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const App = () => {
            const [db, setDb] = useState({ usuarios: [], productos: [], ventas: [], gastos: [] });
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('elite_user')) || null);
            const [view, setView] = useState('pos');
            const [carrito, setCarrito] = useState([]);
            const [mode, setMode] = useState('login');
            const [scanning, setScanning] = useState(false);
            const [search, setSearch] = useState("");

            useEffect(() => {
                const dbRef = database.ref('elite_pos_v2');
                dbRef.on('value', s => { if(s.val()) setDb(s.val()); });
                return () => dbRef.off();
            }, []);

            useEffect(() => {
                if (user) localStorage.setItem('elite_user', JSON.stringify(user));
                else localStorage.removeItem('elite_user');
            }, [user]);

            const sync = (nd) => database.ref('elite_pos_v2').set(nd);
            const storeID = user?.storeID;

            const misProds = useMemo(() => (db.productos || []).filter(p => p.storeID === storeID && p.nombre.toLowerCase().includes(search.toLowerCase())), [db.productos, storeID, search]);
            const misVentas = useMemo(() => (db.ventas || []).filter(v => v.storeID === storeID).reverse(), [db.ventas, storeID]);
            const misGastos = useMemo(() => (db.gastos || []).filter(g => g.storeID === storeID).reverse(), [db.gastos, storeID]);

            // ESCÁNER RECONSTRUIDO
            useEffect(() => {
                let html5QrCode;
                if (scanning) {
                    html5QrCode = new Html5Qrcode("reader");
                    html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (txt) => {
                        const p = (db.productos || []).find(prod => prod.barcode === txt && prod.storeID === storeID);
                        if (p && p.stock > 0) { addItem(p); setScanning(false); html5QrCode.stop(); }
                        else alert("No encontrado o sin stock");
                    }).catch(e => console.log(e));
                }
                return () => { if (html5QrCode?.isScanning) html5QrCode.stop(); };
            }, [scanning]);

            const addItem = (p) => {
                const ex = carrito.find(i => i.id === p.id);
                if (ex && ex.cant >= p.stock) return alert("Sin stock suficiente");
                setCarrito(ex ? carrito.map(i => i.id === p.id ? {...i, cant: i.cant+1} : i) : [...carrito, {...p, cant: 1}]);
            };

            const exportarExcel = () => {
                let csv = "ID,Fecha,Total,Ganancia\n";
                misVentas.forEach(v => { csv += `${v.id},${v.fecha.replace(/,/g, "")},${v.total},${v.ganancia || 0}\n`; });
                const blob = new Blob([csv], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = window.URL.createObjectURL(blob);
                a.download = `Ventas_${user.name}.csv`;
                a.click();
            };

            const finalizarCobro = () => {
                const total = carrito.reduce((a, b) => a + (b.precio * b.cant), 0);
                const costoTotal = carrito.reduce((a, b) => a + ((b.costo || 0) * b.cant), 0);
                const ganancia = total - costoTotal;
                
                const nVenta = { id: Date.now(), total, ganancia, storeID, fecha: new Date().toLocaleString() };
                const nProds = db.productos.map(p => {
                    const v = carrito.find(i => i.id === p.id);
                    return v ? {...p, stock: p.stock - v.cant} : p;
                });
                
                sync({ ...db, ventas: [...(db.ventas || []), nVenta], productos: nProds });
                setCarrito([]);
                alert("¡Venta Exitosa!");
            };

            if (!user) return (
                <div className="h-screen flex items-center justify-center p-6 bg-[#020617]">
                    <div className="w-full max-w-sm glass p-10 rounded-[3rem] text-center shadow-2xl">
                        <h1 className="text-4xl font-black italic mb-10 tracking-tighter">ELITE<span className="text-indigo-500">POS</span></h1>
                        {mode === 'login' ? (
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const u = e.target.u.value.trim().toLowerCase();
                                const p = e.target.p.value.trim();
                                const found = (db.usuarios || []).find(x => x.user.toLowerCase() === u && x.pin === p);
                                if(found) setUser(found); else alert("Datos incorrectos");
                            }} className="space-y-4">
                                <input name="u" className="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white outline-none" placeholder="Usuario" required />
                                <input name="p" type="password" className="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-center text-white outline-none" placeholder="PIN" required />
                                <button className="w-full btn-premium py-5 rounded-2xl font-black uppercase text-xs">Entrar</button>
                                <button type="button" onClick={() => setMode('reg')} className="text-indigo-400 text-[10px] block w-full mt-4 font-bold uppercase underline">Registrar Empresa</button>
                            </form>
                        ) : (
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nu = { user: e.target.u.value.trim().toLowerCase(), pin: e.target.p.value.trim(), name: e.target.n.value, storeID: 'ST-'+Date.now(), role: 'owner' };
                                sync({...db, usuarios: [...(db.usuarios || []), nu]});
                                setMode('login');
                            }} className="space-y-4">
                                <input name="n" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white" placeholder="Nombre Negocio" required />
                                <input name="u" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white" placeholder="Usuario" required />
                                <input name="p" className="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white" placeholder="PIN" required />
                                <button className="w-full btn-premium py-5 rounded-2xl font-black uppercase text-xs">Crear Cuenta</button>
                                <button type="button" onClick={() => setMode('login')} className="text-slate-500 text-[10px] block w-full mt-4 font-bold uppercase">Volver</button>
                            </form>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen">
                    <header className="h-20 glass border-b border-white/5 px-8 flex justify-between items-center shrink-0">
                        <div className="flex flex-col">
                            <span className="text-2xl font-black italic tracking-tighter uppercase">Elite<span className="text-indigo-500">POS</span></span>
                            <span className="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">{user.name} ({user.role})</span>
                        </div>
                        <div className="flex items-center gap-6">
                            <button onClick={() => setView('pos')} className={`text-[11px] font-black tracking-widest ${view==='pos'?'text-white':'text-slate-500'}`}>CAJA</button>
                            {user.role === 'owner' && <button onClick={() => setView('admin')} className={`text-[11px] font-black tracking-widest ${view==='admin'?'text-white':'text-slate-500'}`}>ADMIN</button>}
                            {user.role === 'owner' && <button onClick={() => setView('stats')} className={`text-[11px] font-black tracking-widest ${view==='stats'?'text-white':'text-slate-500'}`}>ESTADISTICAS</button>}
                            <button onClick={() => setUser(null)} className="text-red-500"><i className="fas fa-power-off text-lg"></i></button>
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        <main className="flex-1 overflow-y-auto p-6 custom-scroll">
                            {view === 'pos' ? (
                                <>
                                    <div className="flex gap-4 mb-8">
                                        <input type="text" placeholder="Buscar producto..." className="flex-1 bg-white/5 border border-white/10 p-5 rounded-2xl text-xs outline-none focus:border-indigo-500" onChange={e => setSearch(e.target.value)} />
                                        <button onClick={() => setScanning(!scanning)} className={`w-16 rounded-2xl flex items-center justify-center ${scanning ? 'bg-red-500' : 'bg-indigo-600'}`}>
                                            <i className={`fas ${scanning ? 'fa-times' : 'fa-barcode'} text-lg`}></i>
                                        </button>
                                    </div>
                                    {scanning && <div id="reader"></div>}
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
                                        {misProds.map(p => (
                                            <div key={p.id} onClick={() => p.stock > 0 && addItem(p)} className={`glass p-6 rounded-[2rem] cursor-pointer transition-all active:scale-95 ${p.stock <= 5 ? 'low-stock' : 'hover:border-indigo-500'}`}>
                                                <h3 className="text-[10px] font-black text-slate-500 uppercase mb-2 truncate">{p.nombre}</h3>
                                                <p className="text-3xl font-black italic">$ {p.precio}</p>
                                                <div className="mt-4 pt-4 border-t border-white/5 flex justify-between text-[10px] font-bold">
                                                    <span className="text-slate-500 uppercase tracking-widest">Stock</span>
                                                    <span className={p.stock <= 5 ? 'text-red-500' : 'text-indigo-400 font-black'}>{p.stock} pz</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : view === 'admin' ? (
                                <div className="grid md:grid-cols-2 gap-8 max-w-6xl mx-auto">
                                    <div className="glass p-10 rounded-[2.5rem]">
                                        <h2 className="text-xs font-black mb-8 text-indigo-400 uppercase tracking-widest">Gestión de Inventario Cloud</h2>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const nombre = e.target.n.value.toUpperCase().trim();
                                            const currentProds = [...(db.productos || [])];
                                            const idx = currentProds.findIndex(p => p.nombre === nombre && p.storeID === storeID);
                                            
                                            if(idx !== -1) {
                                                // ACTUALIZACIÓN INTELIGENTE
                                                currentProds[idx] = { 
                                                    ...currentProds[idx], 
                                                    precio: parseFloat(e.target.pr.value), 
                                                    costo: parseFloat(e.target.c.value), 
                                                    stock: currentProds[idx].stock + parseInt(e.target.s.value),
                                                    barcode: e.target.b.value || currentProds[idx].barcode 
                                                };
                                            } else {
                                                // CREACIÓN NUEVA
                                                currentProds.push({ 
                                                    id: Date.now(), 
                                                    barcode: e.target.b.value, 
                                                    nombre, 
                                                    precio: parseFloat(e.target.pr.value), 
                                                    costo: parseFloat(e.target.c.value), 
                                                    stock: parseInt(e.target.s.value), 
                                                    storeID 
                                                });
                                            }
                                            
                                            sync({...db, productos: currentProds});
                                            e.target.reset();
                                            alert("Inventario sincronizado.");
                                        }} className="space-y-4">
                                            <input name="n" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs uppercase" placeholder="Nombre Producto" required />
                                            <div className="grid grid-cols-2 gap-4">
                                                <input name="c" type="number" step="0.01" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Costo Compra" required />
                                                <input name="pr" type="number" step="0.01" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Precio Venta" required />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <input name="b" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Código Barras" />
                                                <input name="s" type="number" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Sumar Stock" required />
                                            </div>
                                            <button className="w-full btn-premium py-5 rounded-xl font-black text-[11px] uppercase tracking-widest">Sincronizar Cambios</button>
                                        </form>
                                    </div>
                                    <div className="glass p-10 rounded-[2.5rem]">
                                        <h2 className="text-xs font-black mb-8 text-red-400 uppercase tracking-widest">Gastos Operativos</h2>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const ng = { id: Date.now(), desc: e.target.d.value, monto: parseFloat(e.target.m.value), fecha: new Date().toLocaleDateString(), storeID };
                                            sync({...db, gastos: [...(db.gastos || []), ng]});
                                            e.target.reset();
                                            alert("Gasto guardado.");
                                        }} className="space-y-4">
                                            <input name="d" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Descripción del Gasto" required />
                                            <input name="m" type="number" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" placeholder="Monto $" required />
                                            <button className="w-full bg-red-600 py-5 rounded-xl font-black text-[11px] uppercase tracking-widest">Registrar Gasto</button>
                                        </form>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-8 max-w-6xl mx-auto">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="glass p-8 rounded-[2rem]">
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Ventas Brutas</p>
                                            <p className="text-4xl font-black italic text-emerald-400">$ {misVentas.reduce((a,b)=>a+b.total, 0).toFixed(2)}</p>
                                        </div>
                                        <div className="glass p-8 rounded-[2rem]">
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Gastos Totales</p>
                                            <p className="text-4xl font-black italic text-red-500">$ {misGastos.reduce((a,b)=>a+b.monto, 0).toFixed(2)}</p>
                                        </div>
                                        <div className="glass p-8 rounded-[2rem]">
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Utilidad Neta</p>
                                            <p className="text-4xl font-black italic text-indigo-400">$ {(misVentas.reduce((a,b)=>a+(b.ganancia || 0), 0) - misGastos.reduce((a,b)=>a+b.monto, 0)).toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <div className="flex justify-end">
                                        <button onClick={exportarExcel} className="bg-emerald-600 hover:bg-emerald-500 px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all"><i className="fas fa-file-excel mr-2"></i> Reporte Excel</button>
                                    </div>
                                </div>
                            )}
                        </main>

                        <aside className="w-full md:w-[380px] glass border-l border-white/10 flex flex-col shrink-0">
                            <div className="p-8 border-b border-white/5 flex justify-between items-center">
                                <h2 className="font-black text-[11px] text-slate-500 uppercase tracking-[0.2em]">Caja</h2>
                                <button onClick={() => setCarrito([])} className="text-red-500 text-[10px] font-black uppercase hover:underline">Vaciar</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll">
                                {carrito.map((i, idx) => (
                                    <div key={idx} className="bg-white/5 p-5 rounded-[1.5rem] flex justify-between items-center border border-white/5">
                                        <div className="flex flex-col">
                                            <span className="font-black text-[11px] uppercase">{i.nombre}</span>
                                            <span className="text-[10px] text-slate-500">{i.cant} x ${i.precio}</span>
                                        </div>
                                        <span className="font-black text-white text-lg">${(i.precio * i.cant).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="p-10 bg-slate-900/50 border-t border-white/10">
                                <div className="flex justify-between items-end mb-8">
                                    <span className="text-slate-500 font-black text-[11px] uppercase tracking-widest leading-none">Total</span>
                                    <span className="text-5xl font-black italic tracking-tighter leading-none">$ {carrito.reduce((a, b) => a + (b.precio * b.cant), 0).toFixed(2)}</span>
                                </div>
                                <button onClick={finalizarCobro} disabled={carrito.length === 0} className="w-full btn-premium py-6 rounded-[1.5rem] font-black uppercase text-xs tracking-widest disabled:opacity-20 transition-all active:scale-95">Cobrar Venta</button>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
