<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE POS | Enterprise Suite</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { background: #020617; font-family: 'Inter', sans-serif; color: white; overflow: hidden; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.7); }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; border: 2px solid #6366f1 !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB_y5tjnNrdMli8_5bd1tKZSSoaCwPRgIA",
            databaseURL: "https://mi-punto-de-venta-e1889-default-rtdb.firebaseio.com",
            projectId: "mi-punto-de-venta-e1889",
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const App = () => {
            const [db, setDb] = useState({ usuarios: [], productos: [], ventas: [] });
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('elite_user')) || null);
            const [view, setView] = useState('pos');
            const [carrito, setCarrito] = useState([]);
            const [mode, setMode] = useState('login');
            const [scanning, setScanning] = useState(false);
            const [search, setSearch] = useState("");

            useEffect(() => {
                const dbRef = database.ref('elite_pos_v2');
                dbRef.on('value', s => { if(s.val()) setDb(s.val()); });
                return () => dbRef.off();
            }, []);

            useEffect(() => {
                if (user) localStorage.setItem('elite_user', JSON.stringify(user));
                else localStorage.removeItem('elite_user');
            }, [user]);

            const sync = (nd) => database.ref('elite_pos_v2').set(nd);
            const storeID = user?.storeID;
            
            const misProds = useMemo(() => 
                (db.productos || []).filter(p => p.storeID === storeID && p.nombre.toLowerCase().includes(search.toLowerCase())),
            [db.productos, storeID, search]);

            const misVentas = useMemo(() => 
                (db.ventas || []).filter(v => v.storeID === storeID).reverse(),
            [db.ventas, storeID]);

            // --- NUEVA FUNCIÓN: GENERAR TICKET PDF ---
            const generarTicket = (venta, items) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: [80, 150] }); // Formato térmico 80mm
                
                doc.setFontSize(12);
                doc.text("ELITE POS SYSTEM", 40, 10, { align: "center" });
                doc.setFontSize(8);
                doc.text(`Sucursal: ${user.name}`, 40, 15, { align: "center" });
                doc.text(`Fecha: ${venta.fecha}`, 10, 25);
                doc.text(`Ticket: #${venta.id.toString().slice(-6)}`, 10, 30);
                doc.text("------------------------------------------", 10, 35);
                
                let y = 40;
                items.forEach(item => {
                    doc.text(`${item.cant}x ${item.nombre.substring(0,15)}`, 10, y);
                    doc.text(`$${(item.precio * item.cant).toFixed(2)}`, 70, y, { align: "right" });
                    y += 5;
                });
                
                doc.text("------------------------------------------", 10, y + 2);
                doc.setFontSize(11);
                doc.text(`TOTAL: $${venta.total.toFixed(2)}`, 70, y + 10, { align: "right" });
                doc.setFontSize(8);
                doc.text("¡Gracias por su compra!", 40, y + 20, { align: "center" });
                
                doc.save(`Ticket_${venta.id}.pdf`);
            };

            // --- NUEVA FUNCIÓN: EXPORTAR EXCEL (CSV) ---
            const exportarVentas = () => {
                let csv = "ID,Fecha,Total\n";
                misVentas.forEach(v => {
                    csv += `${v.id},${v.fecha.replace(/,/g, "")},${v.total}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', `Reporte_Ventas_${user.name}.csv`);
                a.click();
            };

            const addItem = (p) => {
                const ex = carrito.find(i => i.id === p.id);
                if (ex && ex.cant >= p.stock) return alert("Stock máximo alcanzado");
                setCarrito(ex ? carrito.map(i => i.id === p.id ? {...i, cant: i.cant+1} : i) : [...carrito, {...p, cant: 1}]);
            };

            const finalizarCobro = () => {
                const total = carrito.reduce((a, b) => a + (b.precio * b.cant), 0);
                const nVenta = { id: Date.now(), total, storeID, fecha: new Date().toLocaleString() };
                const nProds = db.productos.map(p => {
                    const v = carrito.find(i => i.id === p.id);
                    return v ? {...p, stock: p.stock - v.cant} : p;
                });
                
                sync({ ...db, ventas: [...(db.ventas || []), nVenta], productos: nProds });
                if(confirm("¿Desea descargar el ticket de venta?")) generarTicket(nVenta, carrito);
                setCarrito([]);
                alert("Venta procesada con éxito.");
            };

            // Renderizado de Login...
            if (!user) return (
                <div className="h-screen flex items-center justify-center p-6 bg-[#020617]">
                    <div className="w-full max-w-sm glass p-10 rounded-[3rem] text-center shadow-2xl">
                        <h1 className="text-4xl font-black italic mb-2 tracking-tighter uppercase">Elite<span className="text-indigo-500">POS</span></h1>
                        {mode === 'login' ? (
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const u = e.target.u.value.trim().toLowerCase();
                                const p = e.target.p.value.trim();
                                const found = (db.usuarios || []).find(x => x.user.toLowerCase() === u && x.pin === p);
                                if(found) setUser(found); else alert("Error de credenciales");
                            }} className="space-y-4">
                                <input name="u" className="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white outline-none" placeholder="Usuario" required />
                                <input name="p" type="password" className="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-center text-white outline-none" placeholder="PIN" required />
                                <button className="w-full btn-premium py-5 rounded-2xl font-black uppercase text-xs">Entrar</button>
                                <button type="button" onClick={() => setMode('reg')} className="text-indigo-400 text-[10px] block w-full mt-4 uppercase font-bold">Registrar Empresa</button>
                            </form>
                        ) : (
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const nu = { user: e.target.u.value.trim().toLowerCase(), pin: e.target.p.value.trim(), name: e.target.n.value, storeID: 'ST-'+Date.now(), role: 'owner' };
                                sync({...db, usuarios: [...(db.usuarios || []), nu]});
                                setMode('login');
                            }} className="space-y-4">
                                <input name="n" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-white" placeholder="Negocio" required />
                                <input name="u" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-white" placeholder="Usuario" required />
                                <input name="p" className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-white" placeholder="PIN" required />
                                <button className="w-full btn-premium py-5 rounded-2xl font-black uppercase text-xs">Crear Cuenta</button>
                                <button type="button" onClick={() => setMode('login')} className="text-slate-500 text-[10px] block w-full mt-4 uppercase">Volver</button>
                            </form>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen">
                    <header className="h-20 glass border-b border-white/10 px-8 flex justify-between items-center shrink-0">
                        <div className="flex flex-col">
                            <span className="text-2xl font-black italic tracking-tighter">ELITE<span className="text-indigo-500">POS</span></span>
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">{user.name}</span>
                        </div>
                        <div className="flex items-center gap-6">
                            <button onClick={() => setView('pos')} className={`text-[11px] font-black ${view==='pos'?'text-indigo-400':'text-slate-500'}`}>POS</button>
                            {user.role === 'owner' && <button onClick={() => setView('admin')} className={`text-[11px] font-black ${view==='admin'?'text-indigo-400':'text-slate-500'}`}>DASHBOARD</button>}
                            <button onClick={() => setUser(null)} className="text-red-500"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        <main className="flex-1 overflow-y-auto p-6 custom-scroll">
                            {view === 'pos' ? (
                                <>
                                    <div className="flex gap-4 mb-6">
                                        <input type="text" placeholder="Buscar..." className="flex-1 bg-white/5 border border-white/10 p-4 rounded-2xl text-sm" onChange={e => setSearch(e.target.value)} />
                                        <button onClick={() => setScanning(!scanning)} className={`w-14 rounded-2xl ${scanning ? 'bg-red-500' : 'bg-indigo-600'}`}><i className="fas fa-barcode"></i></button>
                                    </div>
                                    {scanning && <div id="reader" className="mb-6"></div>}
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                        {misProds.map(p => (
                                            <div key={p.id} onClick={() => p.stock > 0 && addItem(p)} className={`glass p-5 rounded-3xl cursor-pointer hover:border-indigo-500 transition-all ${p.stock <= 0 && 'opacity-30'}`}>
                                                <h3 className="text-xs font-bold text-slate-400 uppercase truncate">{p.nombre}</h3>
                                                <p className="text-2xl font-black text-white">$ {p.precio}</p>
                                                <div className="mt-3 flex justify-between text-[10px] font-black">
                                                    <span className="text-slate-500 uppercase">Stock</span>
                                                    <span className={p.stock < 5 ? 'text-red-500' : 'text-indigo-400'}>{p.stock} pz</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <div className="grid md:grid-cols-2 gap-8 max-w-6xl mx-auto">
                                    <div className="glass p-8 rounded-[2rem]">
                                        <h2 className="text-xs font-black mb-6 text-indigo-400 uppercase">Nuevo Producto</h2>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const np = { id: Date.now(), barcode: e.target.b.value, nombre: e.target.n.value.toUpperCase(), precio: parseFloat(e.target.pr.value), stock: parseInt(e.target.s.value), storeID };
                                            sync({...db, productos: [np, ...(db.productos || [])]});
                                            e.target.reset();
                                        }} className="space-y-4">
                                            <input name="b" className="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-xs" placeholder="Código de barras" />
                                            <input name="n" className="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-xs" placeholder="Nombre" required />
                                            <div className="grid grid-cols-2 gap-4">
                                                <input name="pr" type="number" step="0.01" className="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-xs font-bold" placeholder="Precio" required />
                                                <input name="s" type="number" className="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-xs font-bold" placeholder="Stock" required />
                                            </div>
                                            <button className="w-full btn-premium py-4 rounded-xl font-black text-[10px] uppercase">Guardar Producto</button>
                                        </form>
                                    </div>
                                    <div className="space-y-6">
                                        <div className="glass p-8 rounded-[2rem] flex justify-between items-center">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-500 uppercase">Ventas Totales</p>
                                                <p className="text-3xl font-black">$ {misVentas.reduce((a,b)=>a+b.total, 0).toFixed(2)}</p>
                                            </div>
                                            <button onClick={exportarVentas} className="bg-emerald-600 p-4 rounded-2xl text-xs font-black uppercase"><i className="fas fa-file-excel mr-2"></i> Reporte</button>
                                        </div>
                                        <div className="glass p-8 rounded-[2rem]">
                                            <h3 className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Ventas Recientes</h3>
                                            <div className="space-y-3 max-h-60 overflow-y-auto custom-scroll">
                                                {misVentas.map(v => (
                                                    <div key={v.id} className="flex justify-between items-center text-[10px] border-b border-white/5 pb-2">
                                                        <span>{v.fecha}</span>
                                                        <span className="font-black text-indigo-400">$ {v.total.toFixed(2)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        <aside className="w-full md:w-[380px] glass border-l border-white/10 flex flex-col shrink-0">
                            <div className="p-8 border-b border-white/5 flex justify-between">
                                <h2 className="font-black text-[10px] text-slate-500 uppercase tracking-widest">Caja</h2>
                                <button onClick={() => setCarrito([])} className="text-red-500 text-[10px] font-black uppercase">Vaciar</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 space-y-3 custom-scroll">
                                {carrito.map(item => (
                                    <div key={item.id} className="bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                                        <div className="flex flex-col">
                                            <span className="font-black text-white text-[10px] uppercase">{item.nombre}</span>
                                            <span className="text-[10px] text-slate-500">{item.cant}x ${item.precio}</span>
                                        </div>
                                        <span className="font-black text-indigo-400">$ {(item.precio * item.cant).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="p-8 bg-slate-900/80 border-t border-white/10">
                                <div className="flex justify-between items-end mb-6">
                                    <span className="text-slate-500 font-black text-[10px] uppercase">Total</span>
                                    <span className="text-4xl font-black italic">$ {carrito.reduce((a, b) => a + (b.precio * b.cant), 0).toFixed(2)}</span>
                                </div>
                                <button onClick={finalizarCobro} disabled={carrito.length === 0} className="w-full btn-premium py-5 rounded-2xl font-black uppercase text-xs disabled:opacity-20 transition-all">Pagar y Generar Ticket</button>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
