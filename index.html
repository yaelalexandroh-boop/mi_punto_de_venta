<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE POS | Enterprise Full Suite</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { background: #020617; font-family: 'Inter', sans-serif; color: white; overflow: hidden; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.2s; }
        .btn-premium:hover { opacity: 0.9; transform: scale(1.02); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB_y5tjnNrdMli8_5bd1tKZSSoaCwPRgIA",
            databaseURL: "https://mi-punto-de-venta-e1889-default-rtdb.firebaseio.com",
            projectId: "mi-punto-de-venta-e1889",
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const App = () => {
            const [db, setDb] = useState({ usuarios: [], productos: [], ventas: [] });
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('elite_user')) || null);
            const [view, setView] = useState('pos');
            const [carrito, setCarrito] = useState([]);
            const [scanning, setScanning] = useState(false);
            const [search, setSearch] = useState("");

            useEffect(() => {
                const dbRef = database.ref('elite_pos_v2');
                dbRef.on('value', s => { if(s.val()) setDb(s.val()); });
                return () => dbRef.off();
            }, []);

            useEffect(() => {
                if (user) localStorage.setItem('elite_user', JSON.stringify(user));
            }, [user]);

            const sync = (nd) => database.ref('elite_pos_v2').set(nd);
            const storeID = user?.storeID;

            const misProds = useMemo(() => (db.productos || []).filter(p => p.storeID === storeID && p.nombre.toLowerCase().includes(search.toLowerCase())), [db.productos, storeID, search]);
            const misVentas = useMemo(() => (db.ventas || []).filter(v => v.storeID === storeID).reverse(), [db.ventas, storeID]);

            // --- GESTIÓN DE PRODUCTOS (EVITAR DUPLICADOS) ---
            const handleSaveProduct = (e) => {
                e.preventDefault();
                const nombre = e.target.n.value.toUpperCase().trim();
                const barcode = e.target.b.value.trim();
                const precio = parseFloat(e.target.pr.value);
                const stock = parseInt(e.target.s.value);

                let nuevosProductos = [...(db.productos || [])];
                const index = nuevosProductos.findIndex(p => (p.nombre === nombre || (barcode && p.barcode === barcode)) && p.storeID === storeID);

                if (index !== -1) {
                    // Actualizar existente
                    nuevosProductos[index] = { ...nuevosProductos[index], precio, stock: nuevosProductos[index].stock + stock };
                    alert("Producto actualizado (Stock incrementado)");
                } else {
                    // Crear nuevo
                    nuevosProductos.push({ id: Date.now(), barcode, nombre, precio, stock, storeID });
                    alert("Nuevo producto registrado");
                }

                sync({ ...db, productos: nuevosProductos });
                e.target.reset();
            };

            const deleteProd = (id) => {
                if(confirm("¿Eliminar producto?")) {
                    sync({ ...db, productos: db.productos.filter(p => p.id !== id) });
                }
            };

            // --- EXPORTAR EXCEL (CSV) ---
            const exportarVentas = () => {
                const headers = "ID,Fecha,Total\n";
                const rows = misVentas.map(v => `${v.id},${v.fecha},${v.total}`).join("\n");
                const blob = new Blob([headers + rows], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Ventas_${user.name}.csv`;
                a.click();
            };

            const finalizarVenta = () => {
                const total = carrito.reduce((a, b) => a + (b.precio * b.cant), 0);
                const nVenta = { id: Date.now(), total, storeID, fecha: new Date().toLocaleString() };
                const nProds = db.productos.map(p => {
                    const v = carrito.find(i => i.id === p.id);
                    return v ? {...p, stock: p.stock - v.cant} : p;
                });
                sync({ ...db, ventas: [...(db.ventas || []), nVenta], productos: nProds });
                setCarrito([]);
                alert("Venta completada");
            };

            if (!user) return <div className="h-screen flex items-center justify-center bg-[#020617]"><button onClick={() => setView('login')} className="text-white">Cargando...</button></div>;

            return (
                <div className="flex flex-col h-screen">
                    <header className="h-16 glass border-b border-white/5 px-6 flex justify-between items-center shrink-0">
                        <span className="text-xl font-black italic">ELITE<span className="text-indigo-500">POS</span></span>
                        <div className="flex gap-4">
                            <button onClick={() => setView('pos')} className={`text-[10px] font-bold ${view==='pos'?'text-indigo-400':'text-slate-500'}`}>POS</button>
                            <button onClick={() => setView('admin')} className={`text-[10px] font-bold ${view==='admin'?'text-indigo-400':'text-slate-500'}`}>DASHBOARD</button>
                            <button onClick={() => setUser(null)} className="text-red-500"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden">
                        <main className="flex-1 overflow-y-auto p-4 custom-scroll">
                            {view === 'pos' ? (
                                <>
                                    <input type="text" placeholder="Buscar..." className="w-full bg-white/5 border border-white/10 p-4 rounded-xl mb-4" onChange={e => setSearch(e.target.value)} />
                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                        {misProds.map(p => (
                                            <div key={p.id} onClick={() => p.stock > 0 && setCarrito(c => {
                                                const ex = c.find(i => i.id === p.id);
                                                return ex ? c.map(i => i.id === p.id ? {...i, cant: i.cant+1} : i) : [...c, {...p, cant: 1}];
                                            })} className="glass p-4 rounded-2xl cursor-pointer">
                                                <h3 className="text-[10px] font-bold text-slate-400 uppercase">{p.nombre}</h3>
                                                <p className="text-xl font-black">$ {p.precio}</p>
                                                <p className="text-[9px] text-indigo-400 mt-2">Stock: {p.stock}</p>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <div className="grid lg:grid-cols-2 gap-6">
                                    <div className="glass p-6 rounded-3xl h-fit">
                                        <h2 className="text-xs font-bold mb-4 text-indigo-400 uppercase">Gestión de Inventario</h2>
                                        <form onSubmit={handleSaveProduct} className="space-y-3">
                                            <input name="b" className="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs" placeholder="Código Barras" />
                                            <input name="n" className="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs" placeholder="Nombre" required />
                                            <div className="grid grid-cols-2 gap-3">
                                                <input name="pr" type="number" step="0.01" className="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs" placeholder="Precio" required />
                                                <input name="s" type="number" className="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs" placeholder="Stock" required />
                                            </div>
                                            <button className="w-full btn-premium py-3 rounded-xl font-bold text-[10px] uppercase">Guardar / Actualizar</button>
                                        </form>
                                    </div>

                                    <div className="glass p-6 rounded-3xl">
                                        <div className="flex justify-between mb-4">
                                            <h3 className="text-xs font-bold uppercase">Productos en Nube</h3>
                                            <button onClick={exportarVentas} className="text-[9px] bg-emerald-600 px-3 py-1 rounded-full uppercase font-bold">Descargar Reporte</button>
                                        </div>
                                        <div className="space-y-2 max-h-[400px] overflow-y-auto custom-scroll">
                                            {misProds.map(p => (
                                                <div key={p.id} className="flex justify-between items-center p-3 bg-white/5 rounded-xl text-[10px]">
                                                    <span>{p.nombre} | ${p.precio} | {p.stock} u.</span>
                                                    <button onClick={() => deleteProd(p.id)} className="text-red-500"><i className="fas fa-trash"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        <aside className="w-full md:w-[350px] glass border-l border-white/10 flex flex-col">
                            <div className="p-6 border-b border-white/5 font-bold text-xs uppercase text-slate-500">Carrito</div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                {carrito.map((item, idx) => (
                                    <div key={idx} className="bg-white/5 p-3 rounded-xl flex justify-between items-center text-[10px]">
                                        <span>{item.nombre} (x{item.cant})</span>
                                        <span className="font-bold text-indigo-400">${(item.precio * item.cant).toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="p-6 bg-slate-900/80 border-t border-white/10">
                                <div className="flex justify-between items-end mb-4">
                                    <span className="text-[10px] text-slate-500 uppercase">Total</span>
                                    <span className="text-3xl font-black">${carrito.reduce((a, b) => a + (b.precio * b.cant), 0).toFixed(2)}</span>
                                </div>
                                <button onClick={finalizarVenta} disabled={carrito.length === 0} className="w-full btn-premium py-4 rounded-xl font-bold uppercase text-[10px]">Pagar y Finalizar</button>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
